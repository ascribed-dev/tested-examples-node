# Which files are examples, relative to this folder: each example and the
# output it prints. A change to any of them makes its observations stale.
include = ["examples/**"]

# The line of shell that tests them: type-check everything, then run each
# example and compare what it prints with its output file.
test = "npx --no tsc && node --test tests/examples.test.ts"

# What to note about where the test ran. A page says "Tested with" each.
[environment]
node = { label = "Node", command = "node --version" }
typescript = { label = "TypeScript", command = "npx --no -- tsc --version" }
